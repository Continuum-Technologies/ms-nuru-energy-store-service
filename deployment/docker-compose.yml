# =============================================================================
# Nuru Energy Store — standalone production Docker Swarm stack
# =============================================================================
# Fully self-contained: no dependency on any other Zaam repo or shared
# cluster. Traefik terminates TLS (Let's Encrypt, HTTP-01) for
# nuruenergy.co.ke, routing to the nuru-web container. Only one domain was
# purchased (no subdomain DNS available) — the admin dashboard lives at the
# path https://nuruenergy.co.ke/admin, same as local dev, not a subdomain.
#
# Product images are served straight from RustFS at
# https://nuruenergy.co.ke/media/* (Traefik strips the /media prefix).
#
# Traefik's own dashboard is on a separate, non-public entrypoint (:8080) —
# basic-auth protected but NOT meant to be reachable from the internet.
# Firewall that port off publicly and reach it over an SSH tunnel; see
# README.md.
#
# All ${VAR} placeholders are resolved from the shell environment at
# `docker stack deploy` time — Swarm mode does not read `env_file:`. See
# deploy.sh, which sources .env before deploying.
#
# First-time setup: see deploy.sh and README.md in this directory.
# =============================================================================

networks:
  # Traefik + nuru-web only — the public-facing side.
  nuru-public:
    driver: overlay
  # nuru-web + postgres + rustfs — never published on a host port directly.
  # attachable so scripts/migrate.sh can run one-off `docker run` containers
  # against postgres without joining them to the Swarm service mesh.
  nuru-data:
    driver: overlay
    attachable: true

services:
  traefik:
    image: traefik:v3.7
    environment:
      DOCKER_API_VERSION: "1.40"
    command:
      - "--global.checknewversion=false"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.network=nuru-energy_nuru-public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Dashboard-only entrypoint. Deliberately separate from web/websecure so
      # the dashboard's own PathPrefix(/api) rule can never shadow the app's
      # real /api/* routes (uploads, health) on the public domain — the two
      # entrypoints have entirely independent router sets. This port is
      # published below but MUST be firewalled off from the public internet;
      # reach it via an SSH tunnel (see README.md).
      - "--entrypoints.dashboard.address=:8080"
      - "--api.dashboard=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=WARN"
      - "--accesslog=true"
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
      - target: 8080
        published: 8080
        mode: host
    volumes:
      - type: bind
        source: ${DATA_DIR:-/opt/nuru-data}/traefik
        target: /letsencrypt
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks: [nuru-public]
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    deploy:
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 10s
      labels:
        # Traefik routes to itself here — its own docker provider picks up
        # labels on its own service like any other container.
        - "traefik.enable=true"
        - "traefik.http.routers.traefik-dashboard.rule=PathPrefix(`/dashboard`) || PathPrefix(`/api`)"
        - "traefik.http.routers.traefik-dashboard.entrypoints=dashboard"
        - "traefik.http.routers.traefik-dashboard.service=api@internal"
        - "traefik.http.routers.traefik-dashboard.middlewares=traefik-dashboard-auth"
        - "traefik.http.middlewares.traefik-dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
        - "traefik.http.services.nuru-energy-traefik.loadbalancer.server.port=8080"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nuru
      POSTGRES_DB: nuru_db
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - type: bind
        source: ${DATA_DIR:-/opt/nuru-data}/postgres
        target: /var/lib/postgresql/data
      - type: bind
        source: ./postgres/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
    networks: [nuru-data]
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuru -d nuru_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 10s
        window: 60s
      resources:
        limits: { cpus: "1.0", memory: 1G }
        reservations: { cpus: "0.25", memory: 256M }

  rustfs:
    image: rustfs/rustfs:latest
    user: "root"
    environment:
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY}"
    volumes:
      - type: bind
        source: ${DATA_DIR:-/opt/nuru-data}/rustfs/data
        target: /data
      - type: bind
        source: ${DATA_DIR:-/opt/nuru-data}/rustfs/logs
        target: /logs
    networks: [nuru-data, nuru-public]
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    deploy:
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=nuru-energy_nuru-public"
        # Matched before nuru-web's catch-all router below — same Host, but
        # a path prefix is more specific so Traefik would pick this first
        # anyway; the explicit priority just makes that non-negotiable.
        - "traefik.http.routers.nuru-media.rule=Host(`nuruenergy.co.ke`) && PathPrefix(`/media`)"
        - "traefik.http.routers.nuru-media.entrypoints=websecure"
        - "traefik.http.routers.nuru-media.tls.certresolver=letsencrypt"
        - "traefik.http.routers.nuru-media.priority=100"
        - "traefik.http.routers.nuru-media.service=nuru-media"
        - "traefik.http.middlewares.nuru-media-strip.stripprefix.prefixes=/media"
        - "traefik.http.routers.nuru-media.middlewares=nuru-media-strip"
        - "traefik.http.services.nuru-media.loadbalancer.server.port=9000"

  nuru-web:
    image: "${DOCKER_IMAGE:-shamirj/nuru-energy-store}:${NURU_VERSION:-latest}"
    environment:
      NODE_ENV: production
      TZ: Africa/Nairobi
      DATABASE_URL: "postgresql://nuru:${POSTGRES_PASSWORD}@postgres:5432/nuru_db?schema=nuru"
      SESSION_COOKIE_NAME: nuru_session
      SITE_URL: "https://nuruenergy.co.ke"
      RUSTFS_ENDPOINT: "http://rustfs:9000"
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY}"
      RUSTFS_BUCKET: nuru-media
      RUSTFS_PUBLIC_URL: "https://nuruenergy.co.ke/media"
    networks: [nuru-public, nuru-data]
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      resources:
        limits: { cpus: "1.0", memory: 1G }
        reservations: { cpus: "0.25", memory: 256M }
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=nuru-energy_nuru-public"
        - "traefik.http.routers.nuru-web.rule=Host(`nuruenergy.co.ke`)"
        - "traefik.http.routers.nuru-web.entrypoints=websecure"
        - "traefik.http.routers.nuru-web.tls.certresolver=letsencrypt"
        - "traefik.http.services.nuru-web.loadbalancer.server.port=3000"
        - "traefik.http.services.nuru-web.loadbalancer.healthcheck.path=/api/health"
        - "traefik.http.services.nuru-web.loadbalancer.healthcheck.interval=30s"
